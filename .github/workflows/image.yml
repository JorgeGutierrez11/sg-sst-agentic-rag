# 1. DISPARADORES
name: image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


# 2. PERMISOS Y CONCURRENCIA
# Public repository: the token is read-only by default; only the image job adds packages: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# 3. VARIABLES GLOBALES
env:
  IMAGE: sg-sst-backend:local

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    # A failing suite blocks the build, so no untested image is published.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Only the publish step uses this scope, and only on main.
      packages: write
    steps:

      # 4. PREPARACIÓN DEL ENTORNO
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Disk before build
        run: df -h /

      # compose.yaml requires .env; dummy values suffice because startup never calls the LLM.
      - name: Write dummy environment file
        run: |
          cat > .env <<'EOF'
          DEEPSEEK_API_KEY=ci-dummy-key
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          EOF


      # 5. CONSTRUCCIÓN DE LA IMAGEN
      - name: Build image
        run: docker compose build

      - name: Disk and image size after build
        run: |
          df -h /
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}'


      # 6. VERIFICACIÓN DE LA IMAGEN
      - name: Check image hygiene
        run: |
          docker run --rm "$IMAGE" python -c "import torch; v = torch.__version__; print(v); assert v.endswith('+cpu'), v"
          # Capture first so a failing command fails the step instead of yielding zero matches.
          packages="$(docker run --rm "$IMAGE" pip list)"
          if grep -q '^nvidia-' <<<"$packages"; then
            echo "Image contains CUDA packages" >&2
            exit 1
          fi
          test "$(docker run --rm "$IMAGE" id -u)" = 10001
          docker run --rm "$IMAGE" sh -c 'test ! -e /app/.env && test ! -e /app/data && test ! -e /app/evaluation'
          history="$(docker history --no-trunc "$IMAGE")"
          if grep -q DEEPSEEK <<<"$history"; then
            echo "Image history references DEEPSEEK" >&2
            exit 1
          fi


      # 7. PRUEBA DE ARRANQUE
      - name: Start container
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/health
          echo
          curl -fsS http://127.0.0.1:8000/health/ready
          echo


      # 8. PUBLICACIÓN EN GHCR
      # Pushes the smoke-tested image without rebuilding; pull requests never publish.
      - name: Publish image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR requires lowercase repository names.
          registry_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sg-sst-backend"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "sha-${GITHUB_SHA::7}" main; do
            docker tag "$IMAGE" "$registry_image:$tag"
            docker push "$registry_image:$tag"
          done


      # 9. LIMPIEZA
      - name: Container logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Stop container
        if: always()
        run: docker compose down
